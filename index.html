<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio</title>
<style>@view-transition{navigation:auto}</style>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/studio.css">
<link rel="stylesheet" href="assets/search.css">
</head>
<body class="hub">
<a class="sr-only" href="#tools">Skip to tools</a>
<nav class="top"><a class="home" href="index.html" aria-label="Studio home"><img data-brand-logo src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt=""><span class="studio">Studio</span></a><span class="spacer"></span><a class="wn-btn" href="whats-new.html" id="wnBtn" aria-label="What's new"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5l1.6 4.4L16 9.5l-4.4 1.6L10 15.5l-1.6-4.4L4 9.5l4.4-1.6z"/><path d="M18 14l.8 2.2L21 17l-2.2.8L18 20l-.8-2.2L15 17l2.2-.8z"/></svg><span class="wn-dot" aria-hidden="true"></span></a><button type="button" class="acct" id="acct">Sign in</button></nav>
<main id="homeView">
<header class="hero">
  <h1>Make a story in a minute</h1>
  <div class="usearch" id="uSearch" role="search">
    <div class="us-bar">
      <label class="search us-field"><span class="sr-only">Search Studio</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="uq" placeholder="Search all of Studio" dir="auto" enterkeyhint="search" autocomplete="off" spellcheck="false"></label>
      <button type="button" class="us-cancel" id="usCancel" hidden>Cancel</button>
    </div>
    <div class="us-panel" id="usPanel" hidden></div>
  </div>
</header>
<div class="install" id="installBar" role="region" aria-label="Install Studio" hidden><span class="install-ic" aria-hidden="true"><img src="assets/icon-192.png" alt=""></span><span class="install-txt" id="installTxt"><b>Install Studio</b><span>Open it from your home screen like an app.</span></span><button type="button" class="mini solid" id="installGo">Install</button><button type="button" class="mini icon" id="installX" aria-label="Hide this">✕</button></div>

<section class="hub-sec" id="continueSec" aria-labelledby="continueH" hidden>
  <h2 id="continueH">Continue editing</h2>
  <div class="scroller" id="continueList"></div>
</section>

<section class="hub-sec" id="tools" aria-labelledby="toolsH">
  <div class="sec-head"><h2 id="toolsH">Your tools</h2><div class="vswitch" role="group" aria-label="Show tools as" data-view="tools"><button type="button" data-v="list" aria-pressed="true" aria-label="List"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="5" height="5" rx="1"/><path d="M11 6.5h10"/><rect x="3" y="15" width="5" height="5" rx="1"/><path d="M11 17.5h10"/></svg></button><button type="button" data-v="grid" aria-pressed="false" aria-label="Grid"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button></div></div>
  <div class="grid view-list" id="toolGrid"></div>
  <button type="button" class="all-tools" id="allTools"><span class="at-ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span class="at-txt"><b>All tools</b><span id="allToolsSub">Tap a star to pin a tool here</span></span><span class="chev" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span></button>
</section>

<section class="hub-sec" id="savedRow" aria-labelledby="savedRowH">
  <div class="sec-head"><h2 id="savedRowH">Saved designs</h2><a class="see-all" href="#saved" data-see-all>See all<span class="see-n" id="savedCount"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a></div>
  <div class="sv-row scroller" id="savedRowList"></div>
</section>
<p class="foot">Studio keeps your unfinished stories on this phone. Saved designs are shared with your team.<br><a href="whats-new.html" class="foot-ver"><span id="footVer">Studio</span> · What's new</a></p>
<div class="lab-entry"><button type="button" class="lab-btn" id="labBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"/><path d="M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7 15h10"/></svg>Experimental</button></div>
</main>
<section class="saved-page" id="saved" aria-labelledby="savedH" hidden>
  <div class="sp-head">
    <button type="button" class="sp-back" id="savedBack" aria-label="Back to home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="sp-title"><h1 id="savedH">Saved designs</h1><span class="sp-count" id="spCount"></span></div>
    <label class="sr-only" for="sort">Sort saved designs</label><select id="sort" class="sel sort"><option value="recent">Recent</option><option value="name">Name</option></select>
  </div>
  <div class="sp-filters">
    <div class="chips sp-chips" id="typeChips" role="group" aria-label="Show only" hidden></div>
    <div class="chips sp-chips" id="colChips" role="group" aria-label="Collections" hidden></div>
    <div class="col-tools" id="colTools" hidden><button type="button" class="link" id="colRename">Rename collection</button><button type="button" class="link" id="colDelete">Delete collection</button></div>
  </div>
  <div class="sv-grid" id="savedGrid" aria-live="polite"></div>
  <div class="empty" id="savedEmpty" hidden></div>
</section>
<nav class="hubbar" aria-label="Sections"><span class="pill" aria-hidden="true"></span>
  <a href="#" data-tab="home" aria-current="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg><span>Home</span></a>
  <a href="#saved" data-tab="saved" aria-current="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span>Saved</span></a>
</nav>
<button type="button" class="fab" id="fab" aria-haspopup="dialog" aria-expanded="false" aria-label="New: start from a photo or a new design"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<script src="assets/studio.js"></script>
<script src="assets/search.js"></script>
<script src="brands/brands.js"></script>
<script>Studio.home();</script>
</body>
</html>
