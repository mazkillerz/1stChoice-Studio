<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem('studio:lab')!=='"1"')location.replace('../index.html#lab')}catch(e){location.replace('../index.html')}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Board · Lab</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../assets/icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/studio.css">
<link rel="stylesheet" href="board.css">
</head>
<body class="board-app">
<header class="bt" id="topbar">
  <a class="bt-btn bt-back" href="index.html" aria-label="Back to the lab" title="Back to the lab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
  <div class="bt-file">
    <input id="bName" class="bt-name" type="text" maxlength="60" aria-label="Board name" dir="auto" spellcheck="false">
    <button type="button" class="bt-btn" id="fileMenu" aria-label="Board menu" title="Board menu" aria-haspopup="menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <span class="bt-saved" id="bSaved" role="status">Saved</span>
  </div>
  <div class="bt-tools" role="toolbar" aria-label="Tools" id="tools"></div>
  <div class="bt-right">
    <button type="button" class="bt-btn" id="undoB" aria-label="Undo" title="Undo (Ctrl+Z)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button type="button" class="bt-btn" id="redoB" aria-label="Redo" title="Redo (Ctrl+Shift+Z)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button type="button" class="bt-btn bt-zoom" id="zoomB" aria-label="Zoom" title="Zoom" aria-haspopup="menu">100%</button>
    <button type="button" class="bt-btn" id="panelL" aria-label="Layers and add" title="Layers and add" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
    <button type="button" class="bt-btn" id="panelR" aria-label="Design panel" title="Design panel" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
    <button type="button" class="bt-btn" id="presentB" aria-label="Present" title="Present (full screen)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg></button>
    <button type="button" class="bt-export" id="exportB" title="Export (Ctrl+E)">Export</button>
  </div>
</header>
<div class="bw">
  <aside class="bp bp-left" id="left" aria-label="Layers and add">
    <div class="bp-tabs" role="tablist"><button type="button" role="tab" id="tabLayers" aria-selected="true" data-tab="layers">Layers</button><button type="button" role="tab" id="tabAdd" aria-selected="false" data-tab="add">Add</button></div>
    <div class="bp-body" id="layersPane" role="tabpanel" aria-labelledby="tabLayers"><div id="layers" class="layers" role="tree" aria-label="Layers"></div></div>
    <div class="bp-body" id="addPane" role="tabpanel" aria-labelledby="tabAdd" hidden><label class="add-search"><span class="sr-only">Search</span><input type="search" id="addQ" placeholder="Search shapes, icons…" autocomplete="off"></label><div id="addList"></div></div>
  </aside>
  <div class="stage-wrap" id="stageWrap" data-tool="select">
    <div id="stage"></div>
    <div id="badge" class="b-badge" hidden></div>
    <div class="b-corner"><canvas id="mini" class="b-mini" width="180" height="120" aria-label="Map of the board" role="img"></canvas>
      <div class="b-zoom"><button type="button" id="zOut" aria-label="Zoom out">−</button><button type="button" id="zFit" aria-label="Fit everything" title="Fit everything (Shift+1)">Fit</button><button type="button" id="zIn" aria-label="Zoom in">+</button></div></div>
    <div id="cropBar" class="crop-bar" hidden><span>Drag to move the photo inside its box · scroll or pinch to zoom</span><input type="range" id="cropZ" min="1" max="4" step="0.01" aria-label="Zoom photo"><button type="button" class="bt-export" id="cropDone">Done</button></div>
    <div id="cropPad" class="crop-pad" hidden></div>
    <div id="dropHint" class="drop-hint" hidden>Drop photos to add them</div>
  </div>
  <aside class="bp bp-right" id="right" aria-label="Design"><div id="props" class="props"></div></aside>
</div>
<input type="file" id="pickImg" accept="image/*,.heic,.heif" multiple hidden>
<input type="file" id="replaceImg" accept="image/*,.heic,.heif" hidden>
<input type="file" id="pickBoard" accept=".board,application/json" hidden>
<div id="bToast" class="b-toast" role="status" hidden></div>
<div id="menu" class="b-menu" role="menu" hidden></div>
<div id="pop" class="b-pop" hidden></div>
<div id="present" class="present" hidden><img id="presentImg" alt=""><div class="present-bar"><button type="button" id="pPrev" aria-label="Previous">‹</button><span id="pNum"></span><button type="button" id="pNext" aria-label="Next">›</button><button type="button" id="pClose" aria-label="Close">✕</button></div></div>
<script src="../assets/vendor/konva.min.js"></script>
<script src="../assets/studio.js"></script>
<script src="../brands/brands.js"></script>
<script src="board-lib.js"></script>
<script src="board.js"></script>
<script src="board-ui.js"></script>
</body>
</html>
