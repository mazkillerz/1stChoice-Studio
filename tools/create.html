<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Create · Studio</title>
<style>@view-transition{navigation:auto}</style>
<link rel="icon" href="../assets/icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/studio.css">
<link rel="stylesheet" href="create.css">
</head>
<body class="cr">
<header class="cr-top">
  <a class="icon-btn cr-back" href="../index.html" aria-label="All tools" title="All tools"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span class="back-txt">All tools</span></a>
  <div class="cr-name"><input id="crName" type="text" maxlength="60" dir="auto" spellcheck="false" placeholder="Untitled design" aria-label="Design name"><button type="button" class="icon-btn sm" id="crMenu" aria-label="Design menu" title="Design menu" aria-haspopup="menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
  <span class="cr-saved" id="crSaved" role="status"></span>
  <div class="cr-acts">
    <button type="button" class="icon-btn" id="crUndo" aria-label="Undo" title="Undo (Ctrl+Z)" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button type="button" class="icon-btn" id="crRedo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  </div>
</header>
<main class="cr-main" id="crMain">
  <div id="crStage" class="cr-stage" aria-label="Your design. Tap a thing to select it, tap empty space to deselect, drag on empty space to select several."></div>
  <div class="cr-cropbar" id="crCrop" hidden><span>Drag the photo to move it · pinch or slide to zoom</span><input type="range" id="crCropZ" min="1" max="5" step="0.01" aria-label="Zoom the photo"><button type="button" class="btn sm" id="crCropDone">Done</button></div>
  <div class="cr-busy" id="crBusy" hidden><i class="spin" aria-hidden="true"></i><span></span></div>
</main>
<div class="cr-pages" id="crPages" aria-label="Pages"></div>
<div class="cr-ctx" id="crCtx" role="toolbar" aria-label="Edit"></div>
<nav class="cr-bar" id="crBar" aria-label="Create">
  <button type="button" class="tab" data-cr="add"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Add</span></button>
  <button type="button" class="tab" data-cr="text"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5h16v2"/><path d="M9 19h6"/><path d="M12 5v14"/></svg><span>Text</span></button>
  <button type="button" class="tab" data-cr="photo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg><span>Photo</span></button>
  <button type="button" class="tab" data-cr="templates"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Templates</span></button>
  <button type="button" class="tab" data-cr="layers"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg><span>Layers</span></button>
  <button type="button" class="tab save" data-cr="save"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span>Save</span></button>
</nav>
<div class="cr-scrim" id="crScrim" hidden></div>
<section class="cr-sheet" id="crSheet" role="dialog" aria-labelledby="crSheetT" hidden>
  <header class="cr-sh-head"><span class="grab" aria-hidden="true"></span><h2 id="crSheetT" tabindex="-1">Templates</h2><button type="button" class="done" id="crSheetX">Done</button></header>
  <div class="cr-sh-body" id="crSheetB"></div>
</section>
<div class="cr-menu" id="crMenuBox" role="menu" hidden></div>
<div class="cr-toast" id="crToast" role="status" hidden></div>
<input type="file" id="crPick" accept="image/*,.heic,.heif" multiple hidden>
<input type="file" id="crReplace" accept="image/*,.heic,.heif" hidden>
<script src="../assets/vendor/konva.min.js"></script>
<script src="../assets/studio.js"></script>
<script src="../brands/brands.js"></script>
<script src="../lab/board-lib.js"></script>
<script src="create-core.js"></script>
<script src="create-lib.js"></script>
<script src="create-stickers.js"></script>
<script src="create-templates.js"></script>
<script src="create.js"></script>
</body>
</html>
