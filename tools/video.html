<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,interactive-widget=resizes-content">
<title>Video editor · Studio</title>
<style>@view-transition{navigation:auto}</style>
<link rel="icon" href="../assets/icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/studio.css">
<link rel="stylesheet" href="video.css">
</head>
<body class="vd">
<header class="vd-top">
  <a class="icon-btn vd-back" href="../index.html" id="vdBack" aria-label="All tools" title="All tools"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span class="back-txt">All tools</span></a>
  <div class="vd-name"><input id="vdName" type="text" maxlength="60" dir="auto" spellcheck="false" autocomplete="off" enterkeyhint="done" placeholder="Video" aria-label="Video name"><button type="button" class="icon-btn sm" id="vdMenu" aria-label="Video menu" title="Video menu" aria-haspopup="menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
  <span class="vd-status" id="vdStatus" role="status"></span>
  <div class="vd-acts">
    <button type="button" class="icon-btn" id="vdUndo" aria-label="Undo" title="Undo (Ctrl+Z)" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button type="button" class="icon-btn" id="vdRedo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  </div>
  <button type="button" class="btn vd-save" id="vdSave" disabled>Save</button>
</header>
<div class="vd-menu" id="vdMenuBox" role="menu" hidden></div>
<main class="vd-main" id="vdMain">
  <div class="vd-wrap" id="vdWrap">
    <div class="vd-pv" id="vdPv">
      <canvas id="vdCv" width="540" height="960" aria-label="Preview of the video"></canvas>
      <div class="vd-over" id="vdOver"><div class="vd-selbox" id="vdSelBox" hidden></div><i class="vd-guide v" id="vdGx" hidden></i><i class="vd-guide h" id="vdGy" hidden></i></div>
      <div class="vd-safe" id="vdSafe" hidden aria-hidden="true">
        <i class="sz sz-t"><b>Instagram bar</b></i><i class="sz sz-b"><b>Caption and name</b></i><i class="sz sz-l"></i><i class="sz sz-r"><b>Buttons</b></i><i class="sz-box"></i>
      </div>
      <button type="button" class="vd-safebtn" id="vdSafeBtn" aria-pressed="false" aria-label="Safe zones" title="Safe zones" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="8" y="8" width="8" height="8" rx="1.5"/></svg></button>
      <div class="vd-empty" id="vdEmpty" hidden>
        <h2>Start your video</h2>
        <p>Add clips or photos, then words and sound.</p>
        <label class="btn vd-filebtn" id="vdEmptyAdd" tabindex="0"><span>Add clips or photos</span><input type="file" accept="video/*,image/*" multiple id="vdEmptyFile"></label>
        <button type="button" class="link" id="vdEmptyReel">Start from a reel template</button>
        <div class="vd-note" id="vdEmptySt" role="status"></div>
      </div>
      <div class="vd-resume" id="vdResume" hidden><span>You have an unfinished video.</span><button type="button" class="link" id="vdResumeGo">Continue</button><button type="button" class="icon-btn" id="vdResumeX" aria-label="Dismiss" title="Dismiss"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
      <div class="vd-load" id="vdLoad" role="status" aria-live="polite"><i class="spin" aria-hidden="true"></i><span id="vdLoadTxt">Loading the reel…</span></div>
      <div class="vd-err" id="vdErr" hidden><p id="vdErrTxt"></p><button type="button" class="mini" id="vdRetry">Retry</button></div>
    </div>
  </div>
  <div class="vd-trans" id="vdTrans">
    <button type="button" class="vd-play" id="vdPlay" aria-label="Play" disabled><svg class="i-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg><svg class="i-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" hidden><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button>
    <div class="vd-time" id="vdTime" aria-hidden="true"><bdi id="vdNow">0:00.0</bdi> / <bdi id="vdDur">0:00.0</bdi></div>
    <span class="vd-sp"></span>
    <button type="button" class="icon-btn" id="vdZoomOut" aria-label="Zoom out the timeline" title="Zoom out"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="8" x2="14" y1="11" y2="11"/></svg></button>
    <button type="button" class="icon-btn" id="vdZoomIn" aria-label="Zoom in the timeline" title="Zoom in"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg></button>
  </div>
  <div class="vt" id="vdTl">
    <div class="vt-scroll" id="vtScroll" tabindex="0" role="slider" aria-label="Timeline" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" aria-valuetext="0 seconds">
      <div class="vt-in" id="vtIn">
        <div class="vt-ruler" id="vtRuler" aria-hidden="true"></div>
        <div class="vt-lane vt-clips" id="vtClips"></div>
        <div class="vt-lane vt-texts" id="vtTexts"></div>
        <div class="vt-lane vt-audios" id="vtAudios"></div>
      </div>
    </div>
    <i class="vt-head" id="vdHead" aria-hidden="true"></i>
  </div>
  <nav class="vd-bar" id="bar" aria-label="Edit"></nav>
  <section class="vd-sheet" id="vdSheet" hidden aria-label="Edit panel">
    <header class="vd-sh-h"><h2 id="vdShT"></h2><button type="button" class="mini" id="vdShX">Done</button></header>
    <div class="vd-sh-b" id="vdShB"></div>
  </section>
</main>
<div class="vd-dbg" id="vdDbg" hidden></div>
<script src="../assets/studio.js"></script>
<script src="../brands/brands.js"></script>
<script src="../assets/reel.js"></script>
<script src="../assets/reel-audio.js"></script>
<script src="../assets/reel-export.js"></script>
<script src="../assets/reel-project.js"></script>
<script src="video.js"></script>
<script src="video-tl.js"></script>
<script src="video-ui.js"></script>
</body>
</html>
